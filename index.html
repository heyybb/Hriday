/* Hriday HQ refinement: full-viewport canvas + logo-controlled navigation */
html,body,#app{width:100%;min-width:320px;min-height:100%;margin:0}
body{overflow-x:hidden}
.app-shell{display:block;width:100%;min-height:100vh;max-width:none;margin:0}
.main{width:100%;min-height:100vh;max-width:none}
.content{width:100%;max-width:none;margin:0;padding:clamp(18px,2.6vw,38px) clamp(16px,3vw,48px) 56px}
.sidebar{position:fixed;z-index:80;left:0;top:0;bottom:0;width:min(300px,88vw);height:100dvh;min-height:0;transform:translateX(-105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);box-shadow:18px 0 55px rgba(9,32,22,.22);border-right:1px solid rgba(198,161,91,.28)}
.sidebar.open{transform:translateX(0)}
.nav-scrim{position:fixed;inset:0;background:rgba(12,27,20,.35);backdrop-filter:blur(3px);z-index:75;opacity:0;pointer-events:none;transition:opacity .2s}
.nav-scrim.open{opacity:1;pointer-events:auto}
.topbar{width:100%;padding:0 clamp(16px,3vw,48px);z-index:30}
.top-left{display:flex;align-items:center;gap:15px}
.logo-toggle{width:46px;height:46px;flex:0 0 46px;border:1px solid var(--gold);border-radius:50%;background:var(--green);color:var(--gold-2);font:500 28px var(--font-display);box-shadow:0 5px 18px rgba(15,61,46,.16);transition:transform .18s,box-shadow .18s}
.logo-toggle:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(15,61,46,.22)}
.sidebar .brand{cursor:pointer}

  function applyLocalStockMovement(m){const all=loadLocal();const rows=all.materials||[];const mat=rows.find(x=>x.id===m.material_id);if(!mat)return;const qty=Number(m.quantity||0);const plus=['receipt','return_in','adjustment_in'].includes(m.movement_type);const minus=['consume','waste','dispatch','adjustment_out'].includes(m.movement_type);if(plus)mat.quantity_on_hand=Number(mat.quantity_on_hand||0)+qty;if(minus)mat.quantity_on_hand=Math.max(0,Number(mat.quantity_on_hand||0)-qty);if(m.movement_type==='reserve')mat.quantity_reserved=Number(mat.quantity_reserved||0)+qty;if(m.movement_type==='release')mat.quantity_reserved=Math.max(0,Number(mat.quantity_reserved||0)-qty);all.materials=rows;saveLocal(all)}
  async function archiveRecord(key,id){if(['payments','expenses','movements','finished-movements','supplier-payments','task-comments'].includes(key))return toast('Posted transactions are kept in the audit trail. Use an adjustment or reversal rather than deleting them.','warning');const d=modules[key];const row=(state.records[key]||[]).find(x=>x.id===id);if(!row)return;if(!confirm(`Archive/delete this ${d.singular.toLowerCase()} record? In live mode, the database may reject deletion if linked records or audit rules require retention.`))return;try{await deleteRow(d.table,id);await refreshModule(key);renderTable(key);toast('Record removed or archived according to current storage rules.')}catch(err){toast(err.message||'This record could not be deleted. Use a safe archive or reversal instead.','error')}}
  function exportCsv(key,rows){if(!rows.length)return toast('There are no records to export.','warning');const cols=modules[key].columns.map(x=>x[0]);if(isAdmin()&&key==='products')cols.push('unit_cost','selling_price');if(isAdmin()&&key==='orders')cols.push('total_amount');const csv=[cols.join(','),...rows.map(r=>cols.map(c=>{let v=c==='unit_cost'?r._cost?.unit_cost:c==='selling_price'?r._cost?.selling_price:c==='total_amount'?r._finance?.total_amount:r[c];return '"'+String(Array.isArray(v)?v.join('; '):v??'').replace(/"/g,'""')+'"'}).join(','))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`hriday-${key}-${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(a.href);toast('CSV export created.')}
  function reportsMarkup(){return `<div class="section-heading" style="margin-top:0"><div><h2>Reports & insights</h2><p>Business numbers from recorded transactions only. No sample values.</p></div><button class="btn btn-secondary" id="export-finance">↓ Export finance CSV</button></div><div id="reports-top"><div class="metrics"><div class="metric"><div class="metric-label">Loading reports</div><div class="metric-value">—</div></div></div></div><div class="dashboard-grid"><div class="panel"><div class="panel-heading"><div><h3>Performance snapshot</h3><p>Based on current saved records</p></div></div><div id="report-bars" class="empty-state"><strong>Calculating</strong></div></div><div class="panel"><div class="panel-heading"><div><h3>Accounting notes</h3><p>How Hriday HQ calculates the books</p></div></div><div class="small-note"><p><strong>Gross profit</strong> = net sales minus cost of goods sold.</p><p><strong>Operating profit</strong> = gross profit minus operating expenses; tax, finance and other excluded categories should be separately identified.</p><p><strong>Cash flow</strong> = actual cash receipts minus actual cash payments.</p><p>Inventory purchases should not be counted again as operating expenses when cost of goods sold is recognised.</p></div></div></div><div class="section-heading"><div><h2>Recent payments</h2><p>Recorded payment ledger</p></div><button class="btn btn-secondary btn-small" data-page="payments">Open ledger</button></div><div id="report-payments" class="panel"></div>`}
  async function fillReports(){if(!isAdmin())return;const [orders,fs,ps,ex,products]=await Promise.all([safeFetch('orders'),safeFetch('order_financials'),safeFetch('payments'),safeFetch('expenses'),safeFetch('product_costs')]);const orderValue=fs.reduce((n,x)=>n+Number(x.total_amount||0),0);const netSales=fs.reduce((n,x)=>n+Math.max(0,Number(x.subtotal||0)-Number(x.discount_amount||0)),0);const receipts=ps.filter(p=>(p.payment_kind||'receipt')==='receipt').reduce((n,x)=>n+Number(x.amount||0),0);const refunds=ps.filter(p=>p.payment_kind==='refund').reduce((n,x)=>n+Number(x.amount||0),0);const cashExpenses=ex.reduce((n,x)=>n+Number(x.amount||0),0);const cogs=orders.filter(o=>['delivered','dispatched'].includes(o.order_status)).reduce((n,o)=>{const costRow=fs.find(f=>f.order_id===o.id);return n+Number(costRow?.cogs_amount||0)},0);const hasCogs=orders.some(o=>['delivered','dispatched'].includes(o.order_status)&&Number(fs.find(f=>f.order_id===o.id)?.cogs_amount||0)>0);const operating=netSales-cogs-cashExpenses;const supplierBills=await safeFetch('supplier_bills');const supplierPayments=await safeFetch('supplier_payments');const payables=supplierBills.filter(b=>!['paid','void'].includes(b.status)).reduce((n,b)=>n+Math.max(0,Number(b.bill_amount||0)-supplierPayments.filter(p=>p.supplier_bill_id===b.id).reduce((m,p)=>m+Number(p.amount||0),0)),0);document.getElementById('reports-top').innerHTML=`<div class="report-grid"><div class="report-card"><div class="label">Order value</div><div class="value">${fmtMoney(orderValue)}</div><div class="small">Recorded totals incl. configured tax / shipping</div></div><div class="report-card"><div class="label">Cash collected, net refunds</div><div class="value">${fmtMoney(receipts-refunds)}</div><div class="small">Actual payment ledger only</div></div><div class="report-card"><div class="label">Recorded expenses</div><div class="value">${fmtMoney(cashExpenses)}</div><div class="small">Expenses entered into the system</div></div><div class="report-card"><div class="label">Gross profit</div><div class="value">${hasCogs?fmtMoney(netSales-cogs):'—'}</div><div class="small">Net sales minus recorded COGS; unavailable until cost snapshots exist</div></div><div class="report-card"><div class="label">Operating profit</div><div class="value">${hasCogs?fmtMoney(operating):'—'}</div><div class="small">Gross profit minus recorded expenses</div></div><div class="report-card"><div class="label">Supplier payables</div><div class="value">${fmtMoney(payables)}</div><div class="small">Open bill balances after recorded payments</div></div><div class="report-card"><div class="label">Orders</div><div class="value">${orders.length}</div><div class="small">All recorded order states</div></div></div>`;const bars=[['Net sales',netSales],['Cash collected',receipts-refunds],['Expenses',cashExpenses],['Supplier payables',payables]];const max=Math.max(1,...bars.map(b=>Math.abs(b[1])));document.getElementById('report-bars').innerHTML=`<div class="bar-list">${bars.map(([l,v])=>`<div class="bar-line"><span>${esc(l)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,Math.abs(v)/max*100)}%"></div></div><strong style="text-align:right">${fmtMoney(v)}</strong></div>`).join('')}</div><p class="small-note">Profit stays unavailable until cost of goods sold is properly recorded for sold orders. This avoids showing a misleading profit estimate.</p>`;const pdiv=document.getElementById('report-payments');pdiv.innerHTML=ps.length?`<div class="table-wrap"><table style="min-width:500px"><thead><tr><th>Reference</th><th>Type</th><th>Amount</th><th>Date</th></tr></thead><tbody>${ps.slice(0,7).map(p=>`<tr><td>${esc(p.reference||'—')}</td><td>${esc(nice(p.payment_kind||'receipt'))}</td><td>${fmtMoney(p.amount)}</td><td>${fmtDate(p.payment_date)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty-state"><strong>No payments recorded</strong><p>Payments and receipts will appear when you enter actual transactions.</p></div>`;document.getElementById('export-finance').onclick=()=>{const out=[...ps.map(x=>({...x,record_type:'payment'})),...ex.map(x=>({...x,record_type:'expense'}))];const cols=['record_type','amount','payment_date','expense_date','payment_kind','category','reference','description'];const csv=[cols.join(','),...out.map(r=>cols.map(c=>'"'+String(r[c]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='hriday-finance-export.csv';a.click();URL.revokeObjectURL(a.href)}}

  function notificationsMarkup(){return `<div class="section-heading" style="margin-top:0"><div><h2>Notifications</h2><p>Task assignments, approvals and workspace alerts.</p></div><button class="btn btn-secondary btn-small" id="refresh-notifications">Refresh</button></div><div id="notification-list" class="panel"><div class="empty-state"><strong>Loading notifications</strong></div></div>`}
  async function fillNotifications(){try{const rows=(await safeFetch('notifications')).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));const host=document.getElementById('notification-list');host.innerHTML=rows.length?`<div class="list-stack">${rows.map(n=>`<div class="list-row"><div class="avatar">${n.read_at?'✓':'♧'}</div><div class="list-row-main"><strong>${esc(n.title)}</strong><p>${esc(n.body||'')} · ${fmtDate(n.created_at)}</p></div>${!n.read_at?`<button class="btn btn-secondary btn-small" data-read-notification="${esc(n.id)}">Mark read</button>`:`<span class="status-pill grey">Read</span>`}</div>`).join('')}</div>`:`<div class="empty-state"><div class="empty-symbol">♧</div><strong>All quiet in the atelier</strong><p>Notifications will appear here as your team receives assignments and workflow updates. Nothing has been seeded.</p></div>`;host.querySelectorAll('[data-read-notification]').forEach(b=>b.onclick=async()=>{try{await updateRow('notifications',b.dataset.readNotification,{read_at:new Date().toISOString()});await fillNotifications()}catch(err){toast(err.message,'error')}});document.getElementById('refresh-notifications').onclick=()=>fillNotifications()}catch(err){document.getElementById('notification-list').innerHTML=`<div class="notice error">${esc(err.message)}</div>`}}
  function applyLocalFinishedMovement(m){const all=loadLocal();const rows=all.finished_stock||[];const row=rows.find(x=>x.id===m.finished_stock_id);if(!row)return;const q=Number(m.quantity||0);if(['production_complete','return_in','adjustment_in'].includes(m.movement_type))row.quantity_on_hand=Number(row.quantity_on_hand||0)+q;else if(['dispatch','adjustment_out'].includes(m.movement_type))row.quantity_on_hand=Math.max(0,Number(row.quantity_on_hand||0)-q);else if(m.movement_type==='reserve')row.quantity_reserved=Number(row.quantity_reserved||0)+q;else if(m.movement_type==='release')row.quantity_reserved=Math.max(0,Number(row.quantity_reserved||0)-q);all.finished_stock=rows;saveLocal(all)}
  function settingsMarkup(){return `<div class="section-heading" style="margin-top:0"><div><h2>Workspace settings</h2><p>Security, connections and operating preferences.</p></div></div><div class="settings-grid"><div class="settings-card"><div class="panel-heading"><div><h3>Connection status</h3><p>Current data mode</p></div><span class="status-pill ${state.mode==='online'?'':'gold'}">${state.mode==='online'?'Connected session':'Local preview'}</span></div><div class="setting-row"><strong>Backend</strong><span>${state.mode==='online'?'Supabase':'Browser local storage'}</span></div><div class="setting-row"><strong>Owner identity</strong><span>${esc(state.profile?.email||'gaganbogar9021@gmail.com')}</span></div><div class="setting-row"><strong>Role</strong><span>${esc(nice(state.role))}</span></div><div class="setting-row"><strong>Currency</strong><span>INR · ₹</span></div><button class="btn btn-secondary" id="settings-connection" style="margin-top:12px">Connection guide</button></div><div class="settings-card"><div class="panel-heading"><div><h3>Access & recovery</h3><p>Use provider-supported flows</p></div><span class="status-pill grey">Security</span></div><p>Login is handled by Supabase Auth in live mode. Password recovery uses the provider's secure email recovery. Phone OTP requires an SMS provider to be configured separately.</p><p>Never add a service-role key or database password to a public frontend file.</p><button class="btn btn-secondary" id="settings-password">Request password reset</button></div><div class="settings-card"><h3>Brand system</h3><p>Hriday's visual language</p><div class="setting-row"><strong>Bottle green</strong><span>#0F3D2E</span></div><div class="setting-row"><strong>Warm ivory</strong><span>#F5F0E6</span></div><div class="setting-row"><strong>Muted gold</strong><span>#C6A15B</span></div></div><div class="settings-card"><h3>Data integrity</h3><p>Inventory and finance changes should use transaction records, not silent overwrites. Keep regular database backups and review audit logs after important corrections.</p><div class="setting-row"><strong>Starting records</strong><span>Empty</span></div><div class="setting-row"><strong>Google Sheets</strong><span>Optional · not connected</span></div><div class="setting-row"><strong>GitHub</strong><span>Not assumed connected</span></div></div></div><div class="section-heading"><div><h2>Go-live checklist</h2><p>Complete these steps before real company data is entered.</p></div></div><div class="panel"><div class="list-stack">${[['Database schema','Run the supplied Supabase migration and confirm it completes.'],['Owner activation','Verify gaganbogar9021@gmail.com and promote via one-time secure SQL.'],['Designer invitations','Invite two users through Supabase Auth; confirm both are Designer.'],['Security validation','Test direct table/API reads and writes as each role.'],['Hosting','Configure config.js and deploy via an HTTPS static host.'],['Backup','Configure database backups and store a safe copy of the project.']].map(([a,b])=>`<div class="list-row"><div class="avatar">✓</div><div class="list-row-main"><strong>${a}</strong><p>${b}</p></div><span class="status-pill gold">To verify</span></div>`).join('')}</div></div>`}
  function bindSettings(){document.getElementById('settings-connection')?.addEventListener('click',showConnectionGuide);document.getElementById('settings-password')?.addEventListener('click',async()=>{if(state.mode!=='online'||!state.user?.email)return toast('Password recovery is available after live Supabase sign-in.','warning');try{const {error}=await db.auth.resetPasswordForEmail(state.user.email,{redirectTo:location.origin+location.pathname});if(error)throw error;toast('Password reset email requested.')}catch(e){toast(e.message,'error')}})}
  function chatMarkup(){return `<div class="section-heading" style="margin-top:0"><div><h2>Studio conversations</h2><p>Shared messages require the connected cloud workspace.</p></div><button class="btn btn-primary" id="new-channel">＋ New channel</button></div>${state.mode==='local'?`<div class="notice warning" style="margin-bottom:12px">Local preview chat is stored only in this browser and cannot deliver messages to teammates. Connect Supabase for shared real-time messaging.</div>`:''}<div class="chat-layout"><aside class="chat-channels"><div class="nav-label" style="padding:0 7px 8px;color:var(--muted)">Channels</div><div id="chat-channel-list"><div class="small-note">Loading channels...</div></div></aside><section class="chat-window"><div class="chat-top"><strong id="chat-current-title">Your studio</strong><p id="chat-current-subtitle">Choose a channel to see its conversation.</p></div><div class="chat-messages" id="chat-messages"><div class="empty-state"><div class="empty-symbol">◌</div><strong>Make room for conversation</strong><p>Create a channel to begin. In live mode, all messages are stored in the database and access-checked.</p></div></div><form class="chat-compose" id="chat-compose"><input id="chat-input" placeholder="Write a studio update…" autocomplete="off" /><button class="btn btn-primary" type="submit">Send ↗</button></form></section></div>`}
  async function loadChat(){try{const channels=await safeFetch('channels');const member=state.mode==='local'?null:currentUserId();let allowed=channels;if(state.mode==='online'&&!isAdmin()){const memberships=await safeFetch('channel_members');const ids=new Set(memberships.filter(x=>x.user_id===member).map(x=>x.channel_id));allowed=channels.filter(c=>ids.has(c.id))}state.chatChannels=allowed;const h=document.getElementById('chat-channel-list');h.innerHTML=allowed.length?allowed.map(c=>`<button class="chat-channel ${state.chatChannel===c.id?'active':''}" data-channel="${esc(c.id)}">◌ ${esc(c.name)}</button>`).join(''):`<div class="small-note" style="padding:8px">No channels yet. ${isAdmin()?'Create the first channel.':'Ask the owner to add you to a channel.'}</div>`;h.querySelectorAll('[data-channel]').forEach(b=>b.onclick=()=>{state.chatChannel=b.dataset.channel;loadChat()});if(!state.chatChannel&&allowed.length)state.chatChannel=allowed[0].id;const active=allowed.find(c=>c.id===state.chatChannel);if(state.mode==='online'&&active&&db?.channel){if(state.chatRealtimeChannelId!==active.id){if(state.chatRealtimeChannel)try{await db.removeChannel(state.chatRealtimeChannel)}catch{}state.chatRealtimeChannelId=active.id;state.chatRealtimeChannel=db.channel('hriday-chat-'+active.id).on('postgres_changes',{event:'*',schema:'public',table:'messages',filter:'channel_id=eq.'+active.id},()=>{if(state.page==='chat'&&!state._chatReloadPending){state._chatReloadPending=true;setTimeout(async()=>{state._chatReloadPending=false;if(state.page==='chat')await loadChat()},250)}}).subscribe()}}const title=document.getElementById('chat-current-title');const sub=document.getElementById('chat-current-subtitle');if(title)title.textContent=active?.name||'Your studio';if(sub)sub.textContent=active?`${nice(active.channel_type||'channel')} · ${active.description||'Team conversation'}`:'Choose or create a channel';const msgHost=document.getElementById('chat-messages');if(active){const msgs=(await safeFetch('messages')).filter(m=>m.channel_id===active.id).sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at)));state.chatMessages=msgs;msgHost.innerHTML=msgs.length?msgs.map(m=>`<div class="chat-message ${m.sender_id===currentUserId()?'mine':''}"><div class="message-meta">${esc(m.sender_id===currentUserId()?'You':relationLabel('profiles',m.sender_id,'full_name'))} · ${new Date(m.created_at).toLocaleString()}</div><div class="message-bubble">${esc(m.body)}</div></div>`).join(''):`<div class="empty-state"><div class="empty-symbol">◌</div><strong>A new conversation</strong><p>No messages yet. Start with a clear update, question or milestone.</p></div>`;msgHost.scrollTop=msgHost.scrollHeight}else if(msgHost){msgHost.innerHTML=`<div class="empty-state"><strong>No channel selected</strong><p>Create a channel or ask the owner to add you to one.</p></div>`}
      document.getElementById('chat-compose').onsubmit=async e=>{e.preventDefault();const input=document.getElementById('chat-input');const body=input.value.trim();if(!body)return;if(!state.chatChannel)return toast('Select or create a channel first.','warning');try{await insertRow('messages',{channel_id:state.chatChannel,sender_id:currentUserId(),body});input.value='';await loadChat()}catch(err){toast(err.message||'Message could not be sent.','error')}};
      document.getElementById('new-channel').onclick=()=>createChannel();
    }catch(err){document.getElementById('chat-channel-list').innerHTML=`<div class="notice error">${esc(err.message)}. Install the database schema and chat policies first.</div>`}}
  async function createChannel(){if(!isAdmin()&&state.mode==='online')return toast('Only the owner can create channels.','error');openModal('Create a studio channel',`<form id="channel-form"><div class="form-grid"><div class="field"><label>Channel name *</label><input name="name" required placeholder="e.g. production-room" /></div><div class="field"><label>Type</label><select name="channel_type"><option value="team">Team</option><option value="project">Project</option><option value="direct">Direct conversation</option></select></div><div class="field full"><label>Description</label><textarea name="description" placeholder="What belongs in this space?"></textarea></div><div class="field full"><label>Add designer (optional)</label><select name="member_id"><option value="">Add later</option>${(state.relations.profiles||[]).filter(p=>p.id!==currentUserId()&&p.role==='designer').map(p=>`<option value="${esc(p.id)}">${esc(p.full_name||p.email)}</option>`).join('')}</select></div></div><div class="form-actions"><button type="button" class="btn btn-secondary" data-close-modal>Cancel</button><button class="btn btn-primary">Create channel</button></div></form>`);document.getElementById('channel-form').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget);try{const channel=await insertRow('channels',{name:String(fd.get('name')).trim(),channel_type:fd.get('channel_type'),description:String(fd.get('description')||''),is_private:fd.get('channel_type')==='direct',created_by:currentUserId()});if(state.mode==='local'){let ms=localRecords('channel_members');ms.unshift({id:uuid(),channel_id:channel.id,user_id:currentUserId(),created_at:new Date().toISOString()});const member=fd.get('member_id');if(member)ms.unshift({id:uuid(),channel_id:channel.id,user_id:member,created_at:new Date().toISOString()});localPut('channel_members',ms)}else if(fd.get('member_id')){await insertRow('channel_members',{channel_id:channel.id,user_id:fd.get('member_id')})}state.chatChannel=channel.id;document.getElementById('modal-root').innerHTML='';await loadChat();toast('Channel created.')}catch(err){toast(err.message||'Could not create channel.','error')}}}
  function updateNavAfterModal(){document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{state.page=b.dataset.page;renderShell()}))}
  function teamSetupModal(){openModal('Secure team setup',`<p class="small-note">Do not create users by saving passwords in the app database. In Supabase Dashboard: Authentication → Users → Invite user. Invite the owner and each designer by their real email. New profiles default to Designer; activate the verified owner with the one-time SQL in README.md.</p><div class="notice warning">The browser app does not hold the Supabase service-role key, so it cannot safely call the admin invitation API directly. To automate invitations later, use a protected server function with the service-role key stored as a server secret.</div><div class="form-actions"><button class="btn btn-primary" data-close-modal>Understood</button></div>`)}
  function moneyText(v){return fmtMoney(Number(v)||0)}
  // local event delegation and route controls
  document.addEventListener('click',e=>{const q=e.target.closest('[data-quick]');if(q){state.page=q.dataset.quick;state.search='';renderShell()}const p=e.target.closest('[data-page]');if(p&&!p.closest('.sidebar')){state.page=p.dataset.page;renderShell()}const team=e.target.closest('[data-team-help]');if(team)teamSetupModal()});
  async function start(){
    if(!hasConfig){state.mode='local';renderUnconfiguredShell();return}
    state.mode='online';
    const sdkReady=await loadSupabaseSdk();
    if(!sdkReady){renderLogin('Supabase SDK could not load. Check your internet connection, or verify config.js if you intended a local preview.');return}
    try{
      db=window.supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});state.client=db;state.online=true;
      const {data,error}=await db.auth.getSession();if(error)throw error;state.session=data.session;state.user=data.session?.user||null;
      if(!state.session){renderLogin();db.auth.onAuthStateChange((_event,session)=>{state.session=session;state.user=session?.user||null;if(session)setTimeout(()=>bootstrapProfile(),0);else renderLogin()});return}
      await bootstrapProfile();db.auth.onAuthStateChange((_event,session)=>{state.session=session;state.user=session?.user||null;if(session)setTimeout(()=>bootstrapProfile(),0);else renderLogin()});
      if('serviceWorker' in navigator && location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Hriday offline shell:',e));
    }catch(err){console.error('Hriday start:',err);renderLogin('Could not start the connected workspace. Check your Supabase URL/key and auth configuration.')}
  }
  start();
  // Standalone edition opens directly into the local workspace. This is a single-browser preview, not secure multi-user authentication.
  if(!hasConfig){const openBtn=document.getElementById('open-workspace');if(openBtn)openBtn.click()}
})();

</script>
